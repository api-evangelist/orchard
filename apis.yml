name: Orchard
description: >-
  Orchard (Orchard Platform Markets) was a New York City online-lending
  technology company founded in 2013 that provided data, analytics, reporting,
  and an order-management system connecting institutional investors with
  marketplace-lending originators. Backed by Canaan Partners and Spark Capital,
  Orchard was acquired by Kabbage in April 2018 (substantially all assets); its
  team joined Kabbage's data-science org and the standalone product and its
  developer surface were wound down. The orchardplatform.com domain no longer
  resolves and there is no live API, documentation, or developer portal to
  enrich.
